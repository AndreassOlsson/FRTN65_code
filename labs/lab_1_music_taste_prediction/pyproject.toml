[project]
name = "songtaste"
version = "0.1.0"
description = "FRTN65 lab 1: predict which songs Andreas Lindholm likes, as one worked instance of the ML lifecycle"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pandera>=0.24",
    "seaborn>=0.13",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/songtaste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
